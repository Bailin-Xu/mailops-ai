services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailops
      POSTGRES_USER: mailops
      POSTGRES_PASSWORD: mailops_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailops -d mailops"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mailops_postgres_data:/var/lib/postgresql/data

volumes:
  mailops_postgres_data:
