services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailops
      POSTGRES_USER: mailops
      POSTGRES_PASSWORD: mailops_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailops -d mailops"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mailops_postgres_data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: mailops_test
      POSTGRES_USER: mailops_test
      POSTGRES_PASSWORD: mailops_test_local
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailops_test -d mailops_test"]
      interval: 2s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  postgres-agent-a0:
    image: postgres:17-alpine
    profiles: ["agent-a0"]
    environment:
      POSTGRES_DB: mailops_agent_a0
      POSTGRES_USER: mailops_agent_a0
      POSTGRES_PASSWORD: mailops_agent_a0_local
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailops_agent_a0 -d mailops_agent_a0"]
      interval: 2s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  postgres-agent-checkpoint:
    image: postgres:17-alpine
    profiles: ["agent-checkpoint"]
    environment:
      POSTGRES_DB: mailops_agent_checkpoint
      POSTGRES_USER: mailops_agent_checkpoint
      POSTGRES_PASSWORD: mailops_agent_checkpoint_local
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - mailops_agent_checkpoints:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailops_agent_checkpoint -d mailops_agent_checkpoint"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  mailops_agent_checkpoints:
  mailops_postgres_data:
